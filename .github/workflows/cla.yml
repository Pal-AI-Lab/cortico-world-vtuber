name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  cla:
    name: 检查 CLA 签署
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request != null &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == '我已阅读 CLA 文件,并在此签署 CLA'))
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          branch: cla-signatures
          path-to-signatures: signatures/v1/cla.json
          path-to-document: https://github.com/Pal-AI-Lab/cortico-world-vtuber/blob/main/CLA.md
          custom-pr-sign-comment: '我已阅读 CLA 文件,并在此签署 CLA'
          custom-notsigned-prcomment: '感谢你的 PR。这个包用 AGPL-3.0-or-later 发布,合并之前需要你签一份 [CLA](https://github.com/Pal-AI-Lab/cortico-world-vtuber/blob/main/CLA.md)——你保留自己那部分的版权,同时允许项目以任何许可再授权这些贡献。请在这个 PR 里回一条评论,内容正好是:'
          custom-allsigned-prcomment: '这个 PR 的贡献者都已签署 CLA。'
          create-file-commit-message: 'chore(cla): 建立签名记录文件'
          signed-commit-message: 'chore(cla): $contributorName 签署了 CLA(#$pullRequestNo)'
          allowlist: Phantivia,dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
          use-dco-flag: false
